<script>
/* ================= Config ================= */
const SUPABASE_URL = 'https://mmfaofgvueqfqygzxwfm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BZyJdhPfnAcVFyTNUMM7XQ_5WyNS88c';

const sb = (SUPABASE_URL && SUPABASE_KEY && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

/* ================= Local storage ================= */
const STORE_KEY = 'kohaTracker_v2';
const QUEUE_KEY = 'kohaTracker_queue_v2';

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    const s = raw ? JSON.parse(raw) : {hui:[]};
    if(!s.hui) s.hui = [];
    s.hui.forEach(t=>{
      if(!t.entries) t.entries = [];
      if(!t.expenses) t.expenses = [];
      if(!t.activity) t.activity = [];
    });
    return s;
  }catch(e){ return {hui:[]}; }
}
function saveState(){
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}
function loadQueue(){
  try{
    const raw = localStorage.getItem(QUEUE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveQueue(){
  localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
}

let state = loadState();
let queue = loadQueue();
let currentHuiId = null;
let view = 'home'; // home | active | summary

function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}

/* money(), fmtDate(), escapeHtml(), huiTotals() now live in shared.js —
   loaded via <script src="shared.js"> below, shared with view.html and
   koha-tracker-offline.html so a fix to one applies to all three. */

function getHui(id){ return state.hui.find(t=>t.id===id); }

/* ================= Who's making changes ================= */
// No login in this app, so we ask (optionally) who's on this device once,
// and label each History entry with that name.
const ACTOR_KEY = 'kohaTracker_actorName_v1';
function getActorName(){ return localStorage.getItem(ACTOR_KEY) || null; }
function setActorName(name){ localStorage.setItem(ACTOR_KEY, name); }

/* ================= Sync status UI ================= */
let syncState = 'online'; // online | offline | syncing | error
function setSyncState(s){
  syncState = s;
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncText');
  if(!dot) return;
  dot.className = 'sync-dot' + (s==='online' ? '' : ' '+s);
  const labels = {online:'Synced', offline:'Offline', syncing:'Syncing…', error:'Sync issue'};
  text.textContent = sb ? labels[s] : 'Local only';
}

/* ================= Navigation ================= */
function goHome(){
  view='home'; currentHuiId=null;
  render();
}
function openHui(id, toView){
  currentHuiId = id;
  view = toView || 'active';
  render();
}

/* ================= Sync queue ================= */
function enqueue(op){
  queue.push(op);
  saveQueue();
  flushQueue();
}

/* Ops the server actually REJECTED (bad data, missing column, etc.) 5 times
   are moved out of the queue so they can't jam everything behind them — but
   they're kept here, not thrown away, and the reconciling pull in
   initialSync() treats them as still-pending so the local copy of the
   record is never deleted. */
const FAILED_KEY = 'kohaTracker_failed_v1';
function loadFailed(){
  try{
    const raw = localStorage.getItem(FAILED_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveFailed(){
  localStorage.setItem(FAILED_KEY, JSON.stringify(failedOps));
}
let failedOps = loadFailed();
function idleSyncState(){ return failedOps.length ? 'error' : 'online'; }

// A real server rejection comes back from Supabase with an error code
// (e.g. '23503'). A connection failure — including "fake online" wifi with
// no internet behind it — has no code. Only real rejections ever count
// towards giving up on an op; connection failures are retried forever.
function isServerRejection(err){
  return !!(err && typeof err.code === 'string' && err.code.length > 0);
}

// Ids pushed up while initialSync() is mid-pull — the pull may have been
// taken just before they landed, so the reconcile step must not treat them
// as "deleted elsewhere". null when no pull is in progress.
let pushedDuringPull = null;
function notePushed(op){
  if(!pushedDuringPull) return;
  const id = op.payload ? op.payload.id : op.id;
  if(id) pushedDuringPull.add(id);
}

const MAX_OP_RETRIES = 5;
// If a flush is already running, callers get that same in-progress flush
// back (instead of returning straight away), so `await flushQueue()` really
// does wait until this device's pending changes have been pushed.
let flushPromise = null;
function flushQueue(){
  if(!sb) return Promise.resolve();
  if(flushPromise) return flushPromise;
  flushPromise = doFlush().finally(()=>{ flushPromise = null; });
  return flushPromise;
}
async function doFlush(){
  if(!navigator.onLine){ setSyncState('offline'); return; }
  if(queue.length===0){ setSyncState(idleSyncState()); return; }
  setSyncState('syncing');
  while(queue.length){
    const op = queue[0];
    try{
      await runOp(op);
      queue.shift();
      saveQueue();
      notePushed(op);
    }catch(err){
      console.warn('sync op failed', op, err && err.message ? err.message : err);
      if(!navigator.onLine || !isServerRejection(err)){
        // Connection problem, not bad data — keep the op exactly where it
        // is and don't count it towards giving up. Try again next round.
        saveQueue();
        setSyncState('offline');
        return;
      }
      op._retries = (op._retries||0) + 1;
      if(op._retries >= MAX_OP_RETRIES){
        console.error('Server keeps rejecting this sync op — moving it to the failed list:', op, err);
        queue.shift();
        saveQueue();
        failedOps.push(Object.assign({}, op, { _failedAt: Date.now(), _error: (err && err.message) || String(err) }));
        saveFailed();
        continue;
      }
      saveQueue();
      setSyncState('error');
      return;
    }
  }
  setSyncState(idleSyncState());
}

async function runOp(op){
  if(op.type==='upsert_hui'){
    const { error } = await sb.from('hui').upsert(op.payload);
    if(error) throw error;
  } else if(op.type==='delete_hui'){
    const { error } = await sb.from('hui').delete().eq('id', op.id);
    if(error) throw error;
  } else if(op.type==='upsert_entry'){
    const { error } = await sb.from('koha_entries').upsert(op.payload);
    if(error) throw error;
  } else if(op.type==='delete_entry'){
    const { error } = await sb.from('koha_entries').delete().eq('id', op.id);
    if(error) throw error;
  } else if(op.type==='upsert_expense'){
    const { error } = await sb.from('hui_expenses').upsert(op.payload);
    if(error) throw error;
  } else if(op.type==='delete_expense'){
    const { error } = await sb.from('hui_expenses').delete().eq('id', op.id);
    if(error) throw error;
  } else if(op.type==='upsert_activity'){
    const { error } = await sb.from('activity_log').upsert(op.payload);
    if(error) throw error;
  }
}

function huiToRow(t){
  return { id:t.id, name:t.name, date:t.date, location:t.location||null, status:t.status };
}
function entryToRow(huiId, e){
  return {
    id:e.id, hui_id:huiId, name:e.name, type:e.type,
    amount: Number(e.amount)||0, food_desc: e.foodDesc||null, note: e.note||null,
    date: e.date || null
  };
}
function expenseToRow(huiId, ex){
  return {
    id:ex.id, hui_id:huiId, description: ex.description||'',
    amount: Number(ex.amount)||0, date: ex.date || null
  };
}
function activityToRow(huiId, a){
  return {
    id:a.id, hui_id:huiId, entity_type:a.entityType, entity_id:a.entityId,
    action:a.action, actor_name:a.actorName||null, summary:a.summary,
    before_data:a.beforeData||null, after_data:a.afterData||null
  };
}

/* ================= Initial pull + realtime ================= */
// Which local ids still have a not-yet-pushed change sitting in the queue —
// used below so a reconciling pull never deletes something this device
// created/changed offline but hasn't managed to sync up yet.
// Also covers ops on the failed list (never reached the server) and ids
// pushed while the current pull was in flight (see pushedDuringPull).
function queuedIds(upsertType, deleteType){
  const ids = new Set();
  queue.concat(failedOps).forEach(op=>{
    if(op.type===upsertType && op.payload && op.payload.id) ids.add(op.payload.id);
    else if(op.type===deleteType && op.id) ids.add(op.id);
  });
  if(pushedDuringPull) pushedDuringPull.forEach(id=>ids.add(id));
  return ids;
}

// Only ever one full sync at a time — a second caller gets the run that's
// already in progress instead of starting an overlapping one.
let syncPromise = null;
let lastFullSync = 0;
function initialSync(){
  if(!sb) return Promise.resolve();
  if(syncPromise) return syncPromise;
  syncPromise = doInitialSync().finally(()=>{ syncPromise = null; lastFullSync = Date.now(); });
  return syncPromise;
}
async function doInitialSync(){
  if(!sb) return;
  if(!navigator.onLine){ setSyncState('offline'); return; }
  setSyncState('syncing');
  try{
    // Push anything pending from this device first, so the pull just below
    // reflects this device's own changes too (not just everyone else's) —
    // this also keeps the reconciliation step after it safe.
    await flushQueue();

    pushedDuringPull = new Set();
    const [huiRes, entriesRes, expensesRes, activityRes] = await Promise.all([
      sb.from('hui').select('*').order('created_at', {ascending:true}),
      sb.from('koha_entries').select('*').order('created_at', {ascending:true}),
      sb.from('hui_expenses').select('*').order('created_at', {ascending:true}),
      sb.from('activity_log').select('*').order('created_at', {ascending:true})
    ]);
    if(huiRes.error) throw huiRes.error;
    if(entriesRes.error) throw entriesRes.error;
    if(expensesRes.error) throw expensesRes.error;
    // Older databases may not have activity_log yet (legacy migration not run) —
    // don't let that block the rest of sync from working.
    if(activityRes.error) console.warn('activity_log not available yet', activityRes.error);

    huiRes.data.forEach(row => mergeRemoteHui(row));
    entriesRes.data.forEach(row => mergeRemoteEntry(row));
    expensesRes.data.forEach(row => mergeRemoteExpense(row));
    if(!activityRes.error) activityRes.data.forEach(row => mergeRemoteActivity(row));

    // Reconcile deletions: this device may have missed a delete made
    // elsewhere while it wasn't connected (realtime only catches deletes
    // while this tab is open and subscribed). A full pull like this one is
    // the authoritative list, so drop anything local that's no longer in
    // it — except a record still waiting in this device's own queue to be
    // pushed up, which hasn't reached the server yet so won't be in the
    // pull. That protects anything created/changed offline from being
    // wiped out by its own not-yet-synced state.
    const remoteHuiIds = new Set(huiRes.data.map(r=>r.id));
    const pendingHuiIds = queuedIds('upsert_hui', 'delete_hui');
    state.hui = state.hui.filter(t => remoteHuiIds.has(t.id) || pendingHuiIds.has(t.id));

    const remoteEntryIds = new Set(entriesRes.data.map(r=>r.id));
    const pendingEntryIds = queuedIds('upsert_entry', 'delete_entry');
    const remoteExpenseIds = new Set(expensesRes.data.map(r=>r.id));
    const pendingExpenseIds = queuedIds('upsert_expense', 'delete_expense');
    state.hui.forEach(t=>{
      t.entries = t.entries.filter(e => remoteEntryIds.has(e.id) || pendingEntryIds.has(e.id));
      t.expenses = t.expenses.filter(ex => remoteExpenseIds.has(ex.id) || pendingExpenseIds.has(ex.id));
    });

    if(!activityRes.error){
      const remoteActivityIds = new Set(activityRes.data.map(r=>r.id));
      const pendingActivityIds = queuedIds('upsert_activity', '__no_activity_delete__');
      state.hui.forEach(t=>{
        t.activity = (t.activity||[]).filter(a => remoteActivityIds.has(a.id) || pendingActivityIds.has(a.id));
      });
    }

    pushedDuringPull = null;
    saveState();
    render();
    subscribeRealtime();
    await flushQueue(); // sets the final pill state (Synced / Offline / Sync issue)
  }catch(err){
    pushedDuringPull = null;
    console.warn('initial sync failed', err);
    setSyncState('error');
  }
}

function mergeRemoteHui(row){
  let t = getHui(row.id);
  if(!t){
    t = { id:row.id, name:row.name, date:row.date, location:row.location||'', status:row.status, entries:[], expenses:[], activity:[] };
    state.hui.push(t);
  } else {
    t.name = row.name; t.date = row.date; t.location = row.location||''; t.status = row.status;
  }
}
function mergeRemoteEntry(row){
  const t = getHui(row.hui_id);
  if(!t) return; // hui not loaded (shouldn't happen once both fetched)
  let e = t.entries.find(x=>x.id===row.id);
  const ts = row.created_at ? new Date(row.created_at).getTime() : Date.now();
  const date = row.date || (row.created_at ? localDateOf(row.created_at) : '');
  if(!e){
    t.entries.push({ id:row.id, name:row.name, type:row.type, amount:row.amount, foodDesc:row.food_desc||'', note:row.note||'', date, ts });
  } else {
    e.name = row.name; e.type = row.type; e.amount = row.amount; e.foodDesc = row.food_desc||''; e.note = row.note||''; e.date = date; e.ts = ts;
  }
}
function removeRemoteEntry(id){
  state.hui.forEach(t=>{ t.entries = t.entries.filter(e=>e.id!==id); });
}
function mergeRemoteExpense(row){
  const t = getHui(row.hui_id);
  if(!t) return;
  let ex = t.expenses.find(x=>x.id===row.id);
  const ts = row.created_at ? new Date(row.created_at).getTime() : Date.now();
  const date = row.date || (row.created_at ? localDateOf(row.created_at) : '');
  if(!ex){
    t.expenses.push({ id:row.id, description:row.description||'', amount:row.amount, date, ts });
  } else {
    ex.description = row.description||''; ex.amount = row.amount; ex.date = date; ex.ts = ts;
  }
}
function removeRemoteExpense(id){
  state.hui.forEach(t=>{ t.expenses = t.expenses.filter(ex=>ex.id!==id); });
}
function removeRemoteHui(id){
  state.hui = state.hui.filter(t=>t.id!==id);
}
function mergeRemoteActivity(row){
  const t = getHui(row.hui_id);
  if(!t) return;
  if(!t.activity) t.activity = [];
  if(t.activity.find(a=>a.id===row.id)) return; // activity log entries are immutable — nothing to update
  const ts = row.created_at ? new Date(row.created_at).getTime() : Date.now();
  t.activity.push({
    id:row.id, entityType:row.entity_type, entityId:row.entity_id, action:row.action,
    actorName:row.actor_name||null, summary:row.summary,
    beforeData:row.before_data||null, afterData:row.after_data||null, ts
  });
}

let realtimeSubbed = false;
function subscribeRealtime(){
  if(!sb || realtimeSubbed) return;
  realtimeSubbed = true;
  sb.channel('koha-tracker-changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'hui' }, payload=>{
      if(payload.eventType==='DELETE') removeRemoteHui(payload.old.id);
      else mergeRemoteHui(payload.new);
      saveState(); render();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'koha_entries' }, payload=>{
      if(payload.eventType==='DELETE') removeRemoteEntry(payload.old.id);
      else mergeRemoteEntry(payload.new);
      saveState(); render();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'hui_expenses' }, payload=>{
      if(payload.eventType==='DELETE') removeRemoteExpense(payload.old.id);
      else mergeRemoteExpense(payload.new);
      saveState(); render();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'activity_log' }, payload=>{
      if(payload.eventType!=='DELETE') mergeRemoteActivity(payload.new);
      saveState(); render();
    })
    .subscribe(status=>{
      // supabase-js reconnects the channel by itself after a drop, but any
      // changes made while it was down are never replayed — so once it's
      // back, do a full sync to catch up. (Skipped on the very first
      // connect, since initialSync() has only just run.)
      if(status==='SUBSCRIBED'){
        if(realtimeDropped){ realtimeDropped = false; initialSync(); }
      } else if(status==='CHANNEL_ERROR' || status==='TIMED_OUT' || status==='CLOSED'){
        realtimeDropped = true;
      }
    });
}
let realtimeDropped = false;

// Catch up on anything missed while this device was offline, asleep or in
// the background — live updates only cover changes made while connected.
window.addEventListener('online', ()=>{ initialSync(); });
const RESYNC_MIN_GAP_MS = 30000; // don't re-download on every quick app switch
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && sb && navigator.onLine && Date.now()-lastFullSync > RESYNC_MIN_GAP_MS){
    initialSync();
  }
});
window.addEventListener('offline', ()=> setSyncState('offline'));
setInterval(()=>{ if(sb && navigator.onLine) flushQueue(); }, 8000);

/* ================= Activity log ================= */
function logActivity(huiId, entityType, entityId, action, summary, beforeData, afterData){
  const t = getHui(huiId);
  if(!t) return;
  if(!t.activity) t.activity = [];
  const a = {
    id: uid(), entityType, entityId, action,
    actorName: getActorName() || null, summary,
    beforeData: beforeData || null, afterData: afterData || null,
    ts: Date.now()
  };
  t.activity.push(a);
  saveState();
  enqueue({ type:'upsert_activity', payload: activityToRow(huiId, a) });
}
function describeEntryAdd(e){
  const parts = [];
  if(e.type==='cash' || e.type==='both') parts.push(money(e.amount));
  if(e.type==='food' || e.type==='both') parts.push(e.foodDesc ? `food (${e.foodDesc})` : 'food');
  return `Added ${parts.join(' + ')} from ${e.name}`;
}
function describeEntryChange(before, after){
  const changes = [];
  if(before.name !== after.name) changes.push(`name "${before.name}" → "${after.name}"`);
  if((Number(before.amount)||0) !== (Number(after.amount)||0)) changes.push(`amount ${money(before.amount)} → ${money(after.amount)}`);
  if((before.foodDesc||'') !== (after.foodDesc||'')) changes.push(`food "${before.foodDesc||'—'}" → "${after.foodDesc||'—'}"`);
  if((before.note||'') !== (after.note||'')) changes.push(`note "${before.note||'—'}" → "${after.note||'—'}"`);
  if((before.date||'') !== (after.date||'')) changes.push(`date ${fmtDate(before.date)} → ${fmtDate(after.date)}`);
  return changes.length ? `Edited koha from ${after.name}: ${changes.join(', ')}` : `Edited koha from ${after.name}`;
}
function describeExpenseChange(before, after){
  const changes = [];
  if(before.description !== after.description) changes.push(`description "${before.description}" → "${after.description}"`);
  if((Number(before.amount)||0) !== (Number(after.amount)||0)) changes.push(`amount ${money(before.amount)} → ${money(after.amount)}`);
  if((before.date||'') !== (after.date||'')) changes.push(`date ${fmtDate(before.date)} → ${fmtDate(after.date)}`);
  return changes.length ? `Edited expense "${after.description}": ${changes.join(', ')}` : `Edited expense "${after.description}"`;
}

/* ================= Actions ================= */
function createHui(name, date, location){
  const t = {
    id: uid(),
    name: name || 'Hui',
    date: date || todayLocal(),
    location: location || '',
    status: 'open',
    entries: [],
    expenses: [],
    activity: []
  };
  state.hui.unshift(t);
  saveState();
  enqueue({ type:'upsert_hui', payload: huiToRow(t) });
  logActivity(t.id, 'hui', t.id, 'create', `Started hui "${t.name}"`, null, huiToRow(t));
  openHui(t.id, 'active');
}

function deleteHui(id){
  if(!confirm('Delete this koha record? This will permanently delete this hui record and all its koha entries for everyone.')) return;
  state.hui = state.hui.filter(t=>t.id!==id);
  saveState();
  enqueue({ type:'delete_hui', id });
  goHome();
}

function closeHui(id){
  const t = getHui(id);
  if(!t) return;
  const before = huiToRow(t);
  t.status = 'closed';
  saveState();
  enqueue({ type:'upsert_hui', payload: huiToRow(t) });
  logActivity(t.id, 'hui', t.id, 'update', 'Closed the hui', before, huiToRow(t));
  render();
}
function reopenHui(id){
  const t = getHui(id);
  if(!t) return;
  const before = huiToRow(t);
  t.status = 'open';
  saveState();
  enqueue({ type:'upsert_hui', payload: huiToRow(t) });
  logActivity(t.id, 'hui', t.id, 'update', 'Reopened the hui', before, huiToRow(t));
  render();
}

function addEntry(huiId, entry){
  const t = getHui(huiId);
  if(!t) return;
  entry.id = uid();
  entry.ts = Date.now();
  entry.date = entry.date || todayLocal();
  t.entries.push(entry);
  saveState();
  enqueue({ type:'upsert_entry', payload: entryToRow(huiId, entry) });
  logActivity(huiId, 'koha_entry', entry.id, 'create', describeEntryAdd(entry), null, entryToRow(huiId, entry));
  render();
}
function updateEntry(huiId, entryId, fields){
  const t = getHui(huiId);
  if(!t) return;
  const e = t.entries.find(x=>x.id===entryId);
  if(!e) return;
  const before = Object.assign({}, e);
  Object.assign(e, fields);
  saveState();
  enqueue({ type:'upsert_entry', payload: entryToRow(huiId, e) });
  logActivity(huiId, 'koha_entry', entryId, 'update', describeEntryChange(before, e), entryToRow(huiId, before), entryToRow(huiId, e));
  render();
}
function deleteEntry(huiId, entryId){
  const t = getHui(huiId);
  if(!t) return;
  const e = t.entries.find(x=>x.id===entryId);
  if(!confirm(`Remove this koha entry${e ? ' from '+e.name : ''}? This can't be undone.`)) return;
  t.entries = t.entries.filter(e=>e.id!==entryId);
  saveState();
  enqueue({ type:'delete_entry', id: entryId });
  if(e) logActivity(huiId, 'koha_entry', entryId, 'delete', `Removed koha from ${e.name} (${e.type==='food' ? 'food' : money(e.amount)})`, entryToRow(huiId, e), null);
  render();
}

function addExpense(huiId, expense){
  const t = getHui(huiId);
  if(!t) return;
  expense.id = uid();
  expense.ts = Date.now();
  expense.date = expense.date || todayLocal();
  t.expenses.push(expense);
  saveState();
  enqueue({ type:'upsert_expense', payload: expenseToRow(huiId, expense) });
  logActivity(huiId, 'expense', expense.id, 'create', `Added expense "${expense.description}" (${money(expense.amount)})`, null, expenseToRow(huiId, expense));
  render();
}
function updateExpense(huiId, expenseId, fields){
  const t = getHui(huiId);
  if(!t) return;
  const ex = t.expenses.find(x=>x.id===expenseId);
  if(!ex) return;
  const before = Object.assign({}, ex);
  Object.assign(ex, fields);
  saveState();
  enqueue({ type:'upsert_expense', payload: expenseToRow(huiId, ex) });
  logActivity(huiId, 'expense', expenseId, 'update', describeExpenseChange(before, ex), expenseToRow(huiId, before), expenseToRow(huiId, ex));
  render();
}
function deleteExpense(huiId, expenseId){
  const t = getHui(huiId);
  if(!t) return;
  const ex0 = t.expenses.find(x=>x.id===expenseId);
  if(!confirm(`Remove this expense${ex0 ? ' ('+ex0.description+')' : ''}? This can't be undone.`)) return;
  t.expenses = t.expenses.filter(ex=>ex.id!==expenseId);

  if(ex0) logActivity(huiId, 'expense', expenseId, 'delete', `Removed expense "${ex0.description}" (${money(ex0.amount)})`, expenseToRow(huiId, ex0), null);

}

/* ---------- Backup / Restore ---------- */
function backupRestoreCardHtml(){
  return `
    <div class="card no-print">
      <h2>Backup &amp; Restore</h2>
      <p class="muted" style="margin-top:0;">Back up everything to a file, or restore from one. Restoring only adds or updates records — it never deletes anything, so it can't undo recent changes, only bring back lost ones.</p>
      <div class="toolbar" style="margin-top:10px;">
        <button class="btn btn-ghost btn-sm" onclick="backupData()">⬇ Backup All Data</button>
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('restoreFileInput').click()">⬆ Restore from Backup</button>
      </div>
    </div>
  `;
}

function backupData(){
  const data = { app:'koha-tracker', version:1, exportedAt: new Date().toISOString(), hui: state.hui };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayLocal();
  a.href = url;
  a.download = `koha-tracker-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function handleRestoreFile(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{
      data = JSON.parse(reader.result);
    }catch(e){
      alert("That file doesn't look like a valid backup (not valid JSON).");
      event.target.value = '';
      return;
    }
    if(!data || !Array.isArray(data.hui)){
      alert("That file doesn't look like a valid Koha Tracker backup.");
      event.target.value = '';
      return;
    }
    const huiCount = data.hui.length;
    const entryCount = data.hui.reduce((sum,t)=> sum + (t.entries||[]).length, 0);
    const expenseCount = data.hui.reduce((sum,t)=> sum + (t.expenses||[]).length, 0);
    const ok = confirm(
      `Restore ${huiCount} hui, ${entryCount} koha entries and ${expenseCount} expenses from this backup?\n\n` +
      `This only adds or updates records — nothing currently here will be deleted, and it re-syncs to everyone else.\n\n` +
      `It is NOT a way to undo recent changes — it can only bring back older data, not remove anything added since.`
    );
    if(!ok){ event.target.value = ''; return; }
    restoreBackup(data);
    event.target.value = '';
  };
  reader.onerror = () => alert("Couldn't read that file.");
  reader.readAsText(file);
}

function restoreBackup(data){
  data.hui.forEach(t=>{
    if(!t || !t.id || !t.name) return;
    let existing = getHui(t.id);
    if(!existing){
      existing = { id:t.id, name:t.name, date:t.date||todayLocal(), location:t.location||'', status:t.status||'open', entries:[], expenses:[], activity:[] };
      state.hui.push(existing);
    } else {
      existing.name = t.name;
      existing.date = t.date || existing.date;
      existing.location = t.location || '';
      existing.status = t.status || existing.status;
    }
    enqueue({ type:'upsert_hui', payload: huiToRow(existing) });

    (t.entries||[]).forEach(e=>{
      if(!e || !e.id || !e.name) return;
      let ex = existing.entries.find(x=>x.id===e.id);
      const fields = {
        name:e.name, type:e.type||'cash', amount:Number(e.amount)||0,
        foodDesc:e.foodDesc||'', note:e.note||'', date:e.date||existing.date
      };
      if(!ex){
        ex = Object.assign({ id:e.id, ts: e.ts||Date.now() }, fields);
        existing.entries.push(ex);
      } else {
        Object.assign(ex, fields);
      }
      enqueue({ type:'upsert_entry', payload: entryToRow(existing.id, ex) });
    });

    (t.expenses||[]).forEach(x=>{
      if(!x || !x.id || !x.description) return;
      let exx = existing.expenses.find(y=>y.id===x.id);
      const fields = { description:x.description, amount:Number(x.amount)||0, date:x.date||existing.date };
      if(!exx){
        exx = Object.assign({ id:x.id, ts: x.ts||Date.now() }, fields);
        existing.expenses.push(exx);
      } else {
        Object.assign(exx, fields);
      }
      enqueue({ type:'upsert_expense', payload: expenseToRow(existing.id, exx) });
    });

    logActivity(existing.id, 'hui', existing.id, 'update',
      `Restored/merged data from a backup file (${(t.entries||[]).length} koha, ${(t.expenses||[]).length} expenses in the file)`,
      null, null);
  });
  saveState();
  render();
  alert('Backup restored.');
}

    </div>
  `);

function submitEntry(){
  const editingId = document.getElementById('eEditingId').value;
  const name = document.getElementById('eName').value.trim();
  const date = document.getElementById('eDate').value;
  const amount = document.getElementById('eAmount').value;
  const foodDesc = document.getElementById('eFood').value.trim();
  const note = document.getElementById('eNote').value.trim();
  const hasCash = amount && Number(amount) > 0;
  const hasFood = !!foodDesc;

  if(!name){ alert('Please enter who the koha is from.'); return; }
  if(amount && Number(amount) < 0){ alert("Amount can't be negative."); return; }
  if(!hasCash && !hasFood){ alert('Please enter a cash amount, a food description, or both.'); return; }

  closeModal();

  if(editingId){
    // Editing a single existing entry — keep it as one record, whichever
    // fields it now has (cash, food, or both).
    const type = hasCash && hasFood ? 'both' : hasCash ? 'cash' : 'food';
    updateEntry(currentHuiId, editingId, {name, date, type, amount: Number(amount)||0, foodDesc, note});
  } else if(hasCash && hasFood){
    // New entry with both — record as two separate koha entries.
    addEntry(currentHuiId, {name, date, type:'cash', amount: Number(amount)||0, foodDesc:'', note});
    addEntry(currentHuiId, {name, date, type:'food', amount: 0, foodDesc, note});
  } else if(hasCash){
    addEntry(currentHuiId, {name, date, type:'cash', amount: Number(amount)||0, foodDesc:'', note});
  } else {
    addEntry(currentHuiId, {name, date, type:'food', amount: 0, foodDesc, note});
  }
}

    <div class="toolbar no-print">
      <button class="btn btn-ghost btn-sm" onclick="openHui('${t.id}','summary')">📋 View Summary</button>
      ${t.status==='open' ? `<button class="btn btn-danger btn-sm" onclick="closeHui('${t.id}')">Close hui</button>` : `<button class="btn btn-ghost btn-sm" onclick="reopenHui('${t.id}')">Reopen</button>`}
      <button class="btn btn-ghost btn-sm" onclick="huiMoreMenu('${t.id}')">⋯ More</button>
    </div>

    <div class="fab-row no-print">
      <button class="btn btn-primary btn-block" onclick="addEntryModal()">+ Add Koha</button>
    </div>
  `;
}

function huiMoreMenu(huiId){
  const t = getHui(huiId);
  if(!t) return;
  showModal(`
    <h3>More</h3>
    <p class="muted">${escapeHtml(t.name)}</p>
    <div class="toolbar" style="flex-direction:column;">
      <button class="btn btn-ghost btn-block" onclick="closeModal(); exportCSV(getHui('${t.id}'))">⬇ CSV</button>
      <button class="btn btn-ghost btn-block" onclick="closeModal(); copyViewLink('${t.id}')">🔗 Share this hui</button>
      <button class="btn btn-ghost btn-block" onclick="closeModal(); historyModal('${t.id}')">🕐 History</button>
      <button class="btn btn-danger btn-block" onclick="closeModal(); deleteHui('${t.id}')">🗑 Delete hui</button>
    </div>
  `);
}

function activityIcon(action){
  return action==='create' ? '➕' : action==='delete' ? '🗑' : '✏️';
}
function fmtDateTime(ts){
  const d = new Date(ts);
  return d.toLocaleDateString('en-NZ', {day:'numeric', month:'short'}) + ', ' + d.toLocaleTimeString('en-NZ', {hour:'numeric', minute:'2-digit'});
}
function historyModal(huiId){
  const t = getHui(huiId);
  if(!t) return;
  const items = [...(t.activity||[])].sort((a,b)=>b.ts-a.ts);
  const rows = items.length ? items.map(a=>`
    <div class="entry">
      <div>
        <div class="who">${activityIcon(a.action)} ${escapeHtml(a.summary)}</div>
        <div class="meta">${escapeHtml(a.actorName || 'Someone')} · ${fmtDateTime(a.ts)}</div>
      </div>
    </div>
  `).join('') : `<p class="muted" style="padding:14px 4px;">No activity recorded yet.</p>`;
  showModal(`
    <h3>History</h3>
    <p class="muted">${escapeHtml(t.name)} — every koha, expense and hui change, newest first.</p>
    ${rows}
  `);
}

function renderSummary(t){
  const tot = huiTotals(t);
  const entries = [...t.entries].sort((a,b)=>a.ts-b.ts); // chronological, as received
  const listHtml = entries.length ? `<ol class="summary-list">${entries.map(e=>`
      <li>
        <span class="sname">${escapeHtml(e.name)}
          <span class="sfood">${e.date ? fmtDate(e.date) : ''}${e.foodDesc ? (e.date ? ' — ' : '')+escapeHtml(e.foodDesc) : ''}</span>
        </span>
        <span class="samt">${e.type==='food' ? 'Food' : money(e.amount)}${e.type==='both' ? ' + food' : ''}</span>
      </li>
    `).join('')}</ol>` : `<p class="muted">No koha recorded.</p>`;

  const expenses = [...(t.expenses||[])].sort((a,b)=>a.ts-b.ts);
  const expensesListHtml = expenses.length ? `<ol class="summary-list">${expenses.map(ex=>`
      <li>
        <span class="sname">${escapeHtml(ex.description)}
          <span class="sfood">${ex.date ? fmtDate(ex.date) : ''}</span>
        </span>
        <span class="samt">${money(ex.amount)}</span>
      </li>
    `).join('')}</ol>` : `<p class="muted">No expenses recorded.</p>`;

  return `
    <div class="card">
      <h2 style="text-align:center;">Koha Summary</h2>
      <p class="muted" style="text-align:center;">For reading out to whānau</p>
      <div class="totals-strip">
        <div class="total-box">
          <div class="amt">${money(tot.cash)}</div>
          <div class="lbl">Total Cash</div>
        </div>
        <div class="total-box">
          <div class="amt">${tot.total}</div>
          <div class="lbl">Total Koha</div>
        </div>
      </div>
      <div class="totals-strip">
        <div class="total-box">
          <div class="amt">${money(tot.expenses)}</div>
          <div class="lbl">Total Expenses</div>
        </div>
        <div class="total-box">
          <div class="amt">${money(tot.net)}</div>
          <div class="lbl">Net Remaining</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Koha Received</h2>
      ${listHtml}
    </div>

    <div class="card">
      <h2>Expenses</h2>
      ${expensesListHtml}
    </div>

    <div class="toolbar no-print">
      <button class="btn btn-ghost btn-sm" onclick="openHui('${t.id}','active')">← Back to entries</button>
      <button class="btn btn-primary btn-sm" onclick="window.print()">🖨 Print</button>
      <button class="btn btn-ghost btn-sm" onclick="huiMoreMenu('${t.id}')">⋯ More</button>
    </div>
  `;
}

/* ================= Install as app ================= */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'inline-flex';
});
function installApp(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(()=>{
    deferredInstallPrompt = null;
    const btn = document.getElementById('installBtn');
    if(btn) btn.style.display = 'none';
  });
}
window.addEventListener('appinstalled', ()=>{
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'none';
});

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}
if(isIOS() && !isStandalone()){
  const hint = document.getElementById('footerHint');
  if(hint) hint.textContent = 'To install: tap the Share icon in Safari, then "Add to Home Screen".';
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').then(reg => {
      // Check for a newer sw.js/app whenever this tab/app is opened or
      // brought back to the foreground, not just on a fresh page load.
      document.addEventListener('visibilitychange', () => {
        if(document.visibilityState === 'visible') reg.update().catch(()=>{});
      });
      window.addEventListener('focus', () => reg.update().catch(()=>{}));

      // Once a newer service worker takes over, the page it's controlling
      // is still running the OLD code in memory — reload once so the
      // person actually sees the update, instead of it sitting there
      // unused until their next manual refresh.
      let reloadedForUpdate = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if(reloadedForUpdate) return;
        reloadedForUpdate = true;
        window.location.reload();
      });
    }).catch(err=>console.warn('SW registration failed', err));
  });
}

/* ================= Boot ================= */
render();
setSyncState(navigator.onLine ? 'online' : 'offline');
if(sb){ initialSync(); }
if(!getActorName()){ setTimeout(()=>actorNameModal(true), 400); }
</script>
</body>
