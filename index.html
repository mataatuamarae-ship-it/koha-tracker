<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Koha Tracker</title>
<meta name="description" content="Record and read out koha received at hui, shared live across everyone using it.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7a4a2b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Koha">
<style>
  :root{
    --bg:#faf7f2;
    --panel:#ffffff;
    --ink:#2b2420;
    --ink-soft:#6b6259;
    --line:#e6ddd0;
    --brown:#7a4a2b;
    --brown-dark:#5c3620;
    --green:#3f6b4a;
    --green-soft:#e8f0e9;
    --gold:#b9862f;
    --gold-soft:#faf1de;
    --red:#a4433a;
    --radius:14px;
    --shadow:0 2px 10px rgba(60,40,20,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  header{
    background:linear-gradient(135deg,var(--brown) 0%,var(--brown-dark) 100%);
    color:#fff;
    padding:18px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:var(--shadow);
    gap:10px;
  }
  header .title{display:flex;flex-direction:column;min-width:0;}
  header h1{margin:0;font-size:1.15rem;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header .subtitle{font-size:.78rem;opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  header .right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  header button.nav-btn{
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.35);
    color:#fff;
    padding:8px 14px;
    border-radius:10px;
    font-size:.85rem;
    cursor:pointer;
    white-space:nowrap;
  }
  header button.nav-btn:active{background:rgba(255,255,255,0.3);}
  .sync-pill{
    display:flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.3);
    padding:6px 10px;
    border-radius:20px;
    font-size:.72rem;
    color:#fff;
    white-space:nowrap;
  }
  .sync-dot{
    width:8px;height:8px;border-radius:50%;
    background:#8fd19e;
    flex-shrink:0;
  }
  .sync-dot.offline{background:#e0a24a;}
  .sync-dot.syncing{background:#f2d16b;animation:pulse 1s infinite;}
  .sync-dot.error{background:#e26b5f;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  main{
    max-width:760px;
    margin:0 auto;
    padding:16px 14px 100px;
  }
  .card{
    background:var(--panel);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px;
    margin-bottom:16px;
    border:1px solid var(--line);
  }
  .card h2{margin:0 0 4px;font-size:1.05rem;}
  .muted{color:var(--ink-soft);font-size:.85rem;}
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:none;
    border-radius:12px;
    padding:13px 18px;
    font-size:.95rem;
    font-weight:600;
    cursor:pointer;
    transition:transform .05s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--brown);color:#fff;}
  .btn-primary:hover{background:var(--brown-dark);}
  .btn-green{background:var(--green);color:#fff;}
  .btn-ghost{background:transparent;color:var(--brown);border:1.5px solid var(--brown);}
  .btn-danger{background:transparent;color:var(--red);border:1.5px solid var(--red);}
  .btn-block{width:100%;}
  .btn-sm{padding:8px 12px;font-size:.8rem;border-radius:9px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > *{flex:1;}
  label{display:block;font-size:.8rem;font-weight:600;color:var(--ink-soft);margin:12px 0 5px;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=number], input[type=date], textarea, select{
    width:100%;
    padding:12px 12px;
    border:1.5px solid var(--line);
    border-radius:10px;
    font-size:1rem;
    background:#fffdfa;
    color:var(--ink);
    font-family:inherit;
  }
  input:focus, textarea:focus, select:focus{outline:2px solid var(--gold);border-color:var(--gold);}
  textarea{resize:vertical;min-height:54px;}
  .type-toggle{display:flex;gap:8px;margin-top:4px;}
  .type-toggle button{
    flex:1;
    padding:11px 8px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fffdfa;
    font-size:.88rem;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .type-toggle button.active{
    border-color:var(--brown);
    background:var(--gold-soft);
    color:var(--brown-dark);
  }
  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
  }
  .hui-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 4px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .hui-item:last-child{border-bottom:none;}
  .hui-item:active{background:var(--gold-soft);}
  .hui-item .info strong{display:block;font-size:1rem;}
  .hui-item .info span{font-size:.8rem;color:var(--ink-soft);}
  .badge{
    font-size:.7rem;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    text-transform:uppercase;
    letter-spacing:.3px;
  }
  .badge-open{background:var(--green-soft);color:var(--green);}
  .badge-closed{background:#eee;color:#888;}
  .totals-strip{
    display:flex;
    gap:10px;
    margin:6px 0 4px;
  }
  .total-box{
    flex:1;
    background:var(--gold-soft);
    border:1px solid #eddcb8;
    border-radius:12px;
    padding:12px 14px;
    text-align:center;
  }
  .total-box .amt{font-size:1.35rem;font-weight:800;color:var(--brown-dark);}
  .total-box .lbl{font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;}
  .entry{
    padding:12px 4px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
  }
  .entry:last-child{border-bottom:none;}
  .entry .who{font-weight:700;font-size:.98rem;}
  .entry .meta{font-size:.82rem;color:var(--ink-soft);margin-top:2px;}
  .entry .amt{font-weight:800;color:var(--brown-dark);white-space:nowrap;font-size:1rem;}
  .entry-actions{display:flex;gap:6px;margin-top:6px;}
  .entry-actions button{
    background:none;border:none;color:var(--ink-soft);font-size:.75rem;
    text-decoration:underline;cursor:pointer;padding:2px 4px;
  }
  .fab-row{
    position:sticky;
    bottom:0;
    background:linear-gradient(to top, var(--bg) 60%, transparent);
    padding:14px 0 6px;
    display:flex;
    gap:10px;
  }
  .summary-list{list-style:none;margin:0;padding:0;counter-reset:koha;}
  .summary-list li{
    counter-increment:koha;
    padding:13px 4px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
  }
  .summary-list li::before{
    content:counter(koha) ".";
    color:var(--ink-soft);
    font-weight:600;
    margin-right:8px;
    font-variant-numeric:tabular-nums;
  }
  .summary-list .sname{flex:1;font-weight:700;}
  .summary-list .samt{font-weight:800;color:var(--brown-dark);white-space:nowrap;}
  .summary-list .sfood{display:block;font-size:.8rem;font-weight:400;color:var(--ink-soft);margin-top:2px;}
  .field-hint{font-size:.72rem;color:var(--ink-soft);margin-top:4px;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .modal-bg{
    position:fixed;inset:0;background:rgba(30,20,10,0.45);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal{
    background:#fff;border-radius:18px 18px 0 0;
    max-width:760px;width:100%;padding:22px 18px 26px;
    max-height:88vh;overflow-y:auto;
    box-shadow:0 -6px 24px rgba(0,0,0,0.2);
  }
  @media(min-width:820px){
    .modal-bg{align-items:center;}
    .modal{border-radius:16px;}
  }
  .modal h3{margin-top:0;}
  .close-x{
    position:absolute;top:14px;right:16px;background:none;border:none;
    font-size:1.4rem;color:var(--ink-soft);cursor:pointer;
  }
  .modal-inner{position:relative;}
  .name-suggestions{
    display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;
  }
  .name-suggestions button{
    background:var(--green-soft);border:1px solid #cfe4d3;color:var(--green);
    border-radius:20px;padding:5px 12px;font-size:.78rem;cursor:pointer;
  }
  footer.hint{
    text-align:center;color:var(--ink-soft);font-size:.75rem;padding:8px 20px 30px;
  }
  @media print{
    header,.fab-row,.toolbar,.entry-actions,.no-print{display:none !important;}
    body{background:#fff;}
    main{padding:0;max-width:100%;}
    .card{box-shadow:none;border:none;padding:0;}
  }
</style>
</head>
<body>

<header>
  <div class="title">
    <h1 id="headerTitle">Koha Tracker</h1>
    <div class="subtitle" id="headerSubtitle">Koha record &amp; read-out</div>
  </div>
  <div class="right no-print">
    <div class="sync-pill" id="syncPill" title="Sync status">
      <span class="sync-dot" id="syncDot"></span>
      <span id="syncText">Online</span>
    </div>
    <button class="nav-btn" id="installBtn" onclick="installApp()" style="display:none;">⬇ Install</button>
    <button class="nav-btn" id="navBtn" onclick="goHome()" style="display:none;">← All Hui</button>
  </div>
</header>

<main id="app"></main>

<footer class="hint no-print" id="footerHint">Shared live across everyone using this app · works offline and syncs when back online.</footer>

<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ================= Config ================= */
const SUPABASE_URL = 'https://mmfaofgvueqfqygzxwfm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BZyJdhPfnAcVFyTNUMM7XQ_5WyNS88c';

const sb = (SUPABASE_URL && SUPABASE_KEY && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

/* ================= Local storage ================= */
const STORE_KEY = 'kohaTracker_v2';
const QUEUE_KEY = 'kohaTracker_queue_v2';

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    const s = raw ? JSON.parse(raw) : {hui:[]};
    if(!s.hui) s.hui = [];
    s.hui.forEach(t=>{
      if(!t.entries) t.entries = [];
      if(!t.expenses) t.expenses = [];
    });
    return s;
  }catch(e){ return {hui:[]}; }
}
function saveState(){
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}
function loadQueue(){
  try{
    const raw = localStorage.getItem(QUEUE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function saveQueue(){
  localStorage.setItem(QUEUE_KEY, JSON.stringify(queue));
}

let state = loadState();
let queue = loadQueue();
let currentHuiId = null;
let view = 'home'; // home | active | summary

function uid(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c=>{
    const r = Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}

function money(n){
  const v = Number(n)||0;
  return '$' + v.toLocaleString('en-NZ', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-NZ', {day:'numeric', month:'short', year:'numeric'});
}

function getHui(id){ return state.hui.find(t=>t.id===id); }

/* ================= Sync status UI ================= */
let syncState = 'online'; // online | offline | syncing | error
function setSyncState(s){
  syncState = s;
  const dot = document.getElementById('syncDot');
  const text = document.getElementById('syncText');
  if(!dot) return;
  dot.className = 'sync-dot' + (s==='online' ? '' : ' '+s);
  const labels = {online:'Synced', offline:'Offline', syncing:'Syncing…', error:'Sync issue'};
  text.textContent = sb ? labels[s] : 'Local only';
}

/* ================= Navigation ================= */
function goHome(){
  view='home'; currentHuiId=null;
  render();
}
function openHui(id, toView){
  currentHuiId = id;
  view = toView || 'active';
  render();
}

/* ================= Sync queue ================= */
function enqueue(op){
  queue.push(op);
  saveQueue();
  flushQueue();
}

let flushing = false;
const MAX_OP_RETRIES = 5;
async function flushQueue(){
  if(!sb) return;
  if(flushing) return;
  if(!navigator.onLine){ setSyncState('offline'); return; }
  if(queue.length===0){ setSyncState('online'); return; }
  flushing = true;
  setSyncState('syncing');
  let hadDropped = false;
  while(queue.length){
    const op = queue[0];
    try{
      await runOp(op);
      queue.shift();
      saveQueue();
    }catch(err){
      op._retries = (op._retries||0) + 1;
      console.warn(`sync op failed (attempt ${op._retries})`, op, err && err.message ? err.message : err);
      if(!navigator.onLine){
        flushing = false;
        setSyncState('offline');
        return;
      }
      if(op._retries >= MAX_OP_RETRIES){
        // This op keeps failing even though we're online — it's not a transient
        // network blip, it's something structurally wrong (bad data, missing
        // column, etc). Drop it so it can't jam every sync after it forever,
        // but keep the local copy of the record intact.
        console.error('Giving up on sync op after repeated failures, dropping it:', op, err);
        queue.shift();
        saveQueue();
        hadDropped = true;
        continue;
      }
      saveQueue();
      flushing = false;
      setSyncState('error');
      return;
    }
  }
  flushing = false;
  setSyncState(hadDropped ? 'error' : 'online');
}

async function runOp(op){
  if(op.type==='upsert_hui'){
    const { error } = await sb.from('hui').upsert(op.payload);
    if(error) throw error;
  } else if(op.type==='delete_hui'){
    const { error } = await sb.from('hui').delete().eq('id', op.id);
    if(error) throw error;
  } else if(op.type==='upsert_entry'){
    const { error } = await sb.from('koha_entries').upsert(op.payload);
    if(error) throw error;
  } else if(op.type==='delete_entry'){
    const { error } = await sb.from('koha_entries').delete().eq('id', op.id);
    if(error) throw error;
  } else if(op.type==='upsert_expense'){
    const { error } = await sb.from('hui_expenses').upsert(op.payload);
    if(error) throw error;
  } else if(op.type==='delete_expense'){
    const { error } = await sb.from('hui_expenses').delete().eq('id', op.id);
    if(error) throw error;
  }
}

function huiToRow(t){
  return { id:t.id, name:t.name, date:t.date, location:t.location||null, status:t.status };
}
function entryToRow(huiId, e){
  return {
    id:e.id, hui_id:huiId, name:e.name, type:e.type,
    amount: Number(e.amount)||0, food_desc: e.foodDesc||null, note: e.note||null,
    date: e.date || null
  };
}
function expenseToRow(huiId, ex){
  return {
    id:ex.id, hui_id:huiId, description: ex.description||'',
    amount: Number(ex.amount)||0, date: ex.date || null
  };
}

/* ================= Initial pull + realtime ================= */
async function initialSync(){
  if(!sb) return;
  if(!navigator.onLine){ setSyncState('offline'); return; }
  setSyncState('syncing');
  try{
    const [huiRes, entriesRes, expensesRes] = await Promise.all([
      sb.from('hui').select('*').order('created_at', {ascending:true}),
      sb.from('koha_entries').select('*').order('created_at', {ascending:true}),
      sb.from('hui_expenses').select('*').order('created_at', {ascending:true})
    ]);
    if(huiRes.error) throw huiRes.error;
    if(entriesRes.error) throw entriesRes.error;
    if(expensesRes.error) throw expensesRes.error;

    huiRes.data.forEach(row => mergeRemoteHui(row));
    entriesRes.data.forEach(row => mergeRemoteEntry(row));
    expensesRes.data.forEach(row => mergeRemoteExpense(row));

    saveState();
    render();
    subscribeRealtime();
    await flushQueue();
    setSyncState('online');
  }catch(err){
    console.warn('initial sync failed', err);
    setSyncState('error');
  }
}

function mergeRemoteHui(row){
  let t = getHui(row.id);
  if(!t){
    t = { id:row.id, name:row.name, date:row.date, location:row.location||'', status:row.status, entries:[], expenses:[] };
    state.hui.push(t);
  } else {
    t.name = row.name; t.date = row.date; t.location = row.location||''; t.status = row.status;
  }
}
function mergeRemoteEntry(row){
  const t = getHui(row.hui_id);
  if(!t) return; // hui not loaded (shouldn't happen once both fetched)
  let e = t.entries.find(x=>x.id===row.id);
  const ts = row.created_at ? new Date(row.created_at).getTime() : Date.now();
  const date = row.date || (row.created_at ? row.created_at.slice(0,10) : '');
  if(!e){
    t.entries.push({ id:row.id, name:row.name, type:row.type, amount:row.amount, foodDesc:row.food_desc||'', note:row.note||'', date, ts });
  } else {
    e.name = row.name; e.type = row.type; e.amount = row.amount; e.foodDesc = row.food_desc||''; e.note = row.note||''; e.date = date; e.ts = ts;
  }
}
function removeRemoteEntry(id){
  state.hui.forEach(t=>{ t.entries = t.entries.filter(e=>e.id!==id); });
}
function mergeRemoteExpense(row){
  const t = getHui(row.hui_id);
  if(!t) return;
  let ex = t.expenses.find(x=>x.id===row.id);
  const ts = row.created_at ? new Date(row.created_at).getTime() : Date.now();
  const date = row.date || (row.created_at ? row.created_at.slice(0,10) : '');
  if(!ex){
    t.expenses.push({ id:row.id, description:row.description||'', amount:row.amount, date, ts });
  } else {
    ex.description = row.description||''; ex.amount = row.amount; ex.date = date; ex.ts = ts;
  }
}
function removeRemoteExpense(id){
  state.hui.forEach(t=>{ t.expenses = t.expenses.filter(ex=>ex.id!==id); });
}
function removeRemoteHui(id){
  state.hui = state.hui.filter(t=>t.id!==id);
}

let realtimeSubbed = false;
function subscribeRealtime(){
  if(!sb || realtimeSubbed) return;
  realtimeSubbed = true;
  sb.channel('koha-tracker-changes')
    .on('postgres_changes', { event:'*', schema:'public', table:'hui' }, payload=>{
      if(payload.eventType==='DELETE') removeRemoteHui(payload.old.id);
      else mergeRemoteHui(payload.new);
      saveState(); render();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'koha_entries' }, payload=>{
      if(payload.eventType==='DELETE') removeRemoteEntry(payload.old.id);
      else mergeRemoteEntry(payload.new);
      saveState(); render();
    })
    .on('postgres_changes', { event:'*', schema:'public', table:'hui_expenses' }, payload=>{
      if(payload.eventType==='DELETE') removeRemoteExpense(payload.old.id);
      else mergeRemoteExpense(payload.new);
      saveState(); render();
    })
    .subscribe();
}

window.addEventListener('online', ()=>{ flushQueue(); if(sb && !realtimeSubbed) initialSync(); });
window.addEventListener('offline', ()=> setSyncState('offline'));
setInterval(()=>{ if(sb && navigator.onLine) flushQueue(); }, 8000);

/* ================= Actions ================= */
function createHui(name, date, location){
  const t = {
    id: uid(),
    name: name || 'Hui',
    date: date || new Date().toISOString().slice(0,10),
    location: location || '',
    status: 'open',
    entries: [],
    expenses: []
  };
  state.hui.unshift(t);
  saveState();
  enqueue({ type:'upsert_hui', payload: huiToRow(t) });
  openHui(t.id, 'active');
}

function deleteHui(id){
  if(!confirm('Delete this koha record? This will permanently delete this hui record and all its koha entries for everyone.')) return;
  state.hui = state.hui.filter(t=>t.id!==id);
  saveState();
  enqueue({ type:'delete_hui', id });
  goHome();
}

function closeHui(id){
  const t = getHui(id);
  if(!t) return;
  t.status = 'closed';
  saveState();
  enqueue({ type:'upsert_hui', payload: huiToRow(t) });
  render();
}
function reopenHui(id){
  const t = getHui(id);
  if(!t) return;
  t.status = 'open';
  saveState();
  enqueue({ type:'upsert_hui', payload: huiToRow(t) });
  render();
}

function addEntry(huiId, entry){
  const t = getHui(huiId);
  if(!t) return;
  entry.id = uid();
  entry.ts = Date.now();
  entry.date = entry.date || new Date().toISOString().slice(0,10);
  t.entries.push(entry);
  saveState();
  enqueue({ type:'upsert_entry', payload: entryToRow(huiId, entry) });
  render();
}
function updateEntry(huiId, entryId, fields){
  const t = getHui(huiId);
  if(!t) return;
  const e = t.entries.find(x=>x.id===entryId);
  if(!e) return;
  Object.assign(e, fields);
  saveState();
  enqueue({ type:'upsert_entry', payload: entryToRow(huiId, e) });
  render();
}
function deleteEntry(huiId, entryId){
  const t = getHui(huiId);
  if(!t) return;
  t.entries = t.entries.filter(e=>e.id!==entryId);
  saveState();
  enqueue({ type:'delete_entry', id: entryId });
  render();
}

function addExpense(huiId, expense){
  const t = getHui(huiId);
  if(!t) return;
  expense.id = uid();
  expense.ts = Date.now();
  expense.date = expense.date || new Date().toISOString().slice(0,10);
  t.expenses.push(expense);
  saveState();
  enqueue({ type:'upsert_expense', payload: expenseToRow(huiId, expense) });
  render();
}
function updateExpense(huiId, expenseId, fields){
  const t = getHui(huiId);
  if(!t) return;
  const ex = t.expenses.find(x=>x.id===expenseId);
  if(!ex) return;
  Object.assign(ex, fields);
  saveState();
  enqueue({ type:'upsert_expense', payload: expenseToRow(huiId, ex) });
  render();
}
function deleteExpense(huiId, expenseId){
  const t = getHui(huiId);
  if(!t) return;
  t.expenses = t.expenses.filter(ex=>ex.id!==expenseId);
  saveState();
  enqueue({ type:'delete_expense', id: expenseId });
  render();
}

function huiTotals(t){
  let cash = 0, foodCount = 0;
  t.entries.forEach(e=>{
    if(e.type==='cash' || e.type==='both') cash += Number(e.amount)||0;
    if(e.type==='food' || e.type==='both') foodCount += 1;
  });
  const expenses = (t.expenses||[]).reduce((sum,ex)=> sum + (Number(ex.amount)||0), 0);
  return {cash, foodCount, total: t.entries.length, expenses, net: cash - expenses};
}

function knownNames(){
  const set = new Set();
  state.hui.forEach(t=>t.entries.forEach(e=>{ if(e.name) set.add(e.name); }));
  return Array.from(set).sort();
}

/* ---------- CSV Export ---------- */
function exportCSV(t){
  const rows = [['#','Date','Whanau / Hapu','Type','Amount (NZD)','Food / Item Description','Note','Entered']];
  const ordered = [...t.entries].sort((a,b)=>a.ts-b.ts);
  ordered.forEach((e,i)=>{
    rows.push([
      i+1,
      e.date || '',
      e.name||'',
      e.type,
      e.type==='food' ? '' : (Number(e.amount)||0).toFixed(2),
      e.foodDesc||'',
      e.note||'',
      new Date(e.ts).toLocaleString('en-NZ')
    ]);
  });
  const totals = huiTotals(t);
  rows.push([]);
  rows.push(['','','TOTAL CASH KOHA', totals.cash.toFixed(2)]);
  rows.push(['','','TOTAL KOHA ENTRIES', totals.total]);

  if((t.expenses||[]).length){
    rows.push([]);
    rows.push(['EXPENSES']);
    rows.push(['#','Date','Description','Amount (NZD)']);
    const orderedEx = [...t.expenses].sort((a,b)=>a.ts-b.ts);
    orderedEx.forEach((ex,i)=>{
      rows.push([i+1, ex.date||'', ex.description||'', (Number(ex.amount)||0).toFixed(2)]);
    });
  }
  rows.push([]);
  rows.push(['','','TOTAL EXPENSES', totals.expenses.toFixed(2)]);
  rows.push(['','','NET (CASH KOHA - EXPENSES)', totals.net.toFixed(2)]);

  const csv = rows.map(r => r.map(cell=>{
    const s = String(cell ?? '');
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\n');

  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const safeName = (t.name||'hui').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
  a.href = url;
  a.download = `koha-${safeName}-${t.date}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ---------- Modals ---------- */
function showModal(html){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="modal-inner">
          <button class="close-x" onclick="closeModal()">&times;</button>
          ${html}
        </div>
      </div>
    </div>`;
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

function newHuiModal(){
  const today = new Date().toISOString().slice(0,10);
  showModal(`
    <h3>Start New Hui</h3>
    <p class="muted">Start a new koha record</p>
    <label>Whānau / Name (name of the hui or whānau)</label>
    <input type="text" id="ntName" placeholder="e.g. Wiremu whānau" />
    <label>Date</label>
    <input type="date" id="ntDate" value="${today}" />
    <label>Marae / Location <span class="field-hint">(optional)</span></label>
    <input type="text" id="ntLoc" placeholder="e.g. Manawa Marae" />
    <div class="toolbar">
      <button class="btn btn-primary btn-block" onclick="submitNewHui()">Start</button>
    </div>
  `);
  setTimeout(()=>document.getElementById('ntName').focus(), 50);
}
function submitNewHui(){
  const name = document.getElementById('ntName').value.trim();
  const date = document.getElementById('ntDate').value;
  const loc = document.getElementById('ntLoc').value.trim();
  if(!name){ alert('Please enter a name for this hui.'); return; }
  closeModal();
  createHui(name, date, loc);
}

function addEntryModal(){
  const defaultDate = new Date().toISOString().slice(0,10);
  entryModal({ date: defaultDate, type:'cash' }, null);
}

function editEntryModal(huiId, entryId){
  const t = getHui(huiId);
  if(!t) return;
  const e = t.entries.find(x=>x.id===entryId);
  if(!e) return;
  entryModal(e, entryId);
}

function entryModal(entry, editingId){
  const names = knownNames();
  const isEdit = !!editingId;
  showModal(`
    <h3>${isEdit ? 'Edit Koha' : 'Add Koha'}</h3>
    <p class="muted">${isEdit ? 'Update this koha entry' : 'Add a koha entry'}</p>
    <input type="hidden" id="eEditingId" value="${editingId || ''}" />
    <label>From (whānau / hapū / individual)</label>
    <input type="text" id="eName" placeholder="e.g. Ngāti Huri whānau" list="nameList" value="${escapeHtml(entry.name||'')}"/>
    <datalist id="nameList">${names.map(n=>`<option value="${escapeHtml(n)}">`).join('')}</datalist>

    <label>Date</label>
    <input type="date" id="eDate" value="${entry.date || ''}" />

    <label>Koha type</label>
    <div class="type-toggle" id="typeToggle">
      <button type="button" data-type="cash" class="${entry.type==='cash'?'active':''}">💵 Cash</button>
      <button type="button" data-type="food" class="${entry.type==='food'?'active':''}">🍽️ Food</button>
      <button type="button" data-type="both" class="${entry.type==='both'?'active':''}">Both</button>
    </div>

    <div id="cashField" style="display:${entry.type==='food' ? 'none':'block'};">
      <label>Amount ($NZD)</label>
      <input type="number" id="eAmount" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="${entry.amount ? entry.amount : ''}"/>
    </div>
    <div id="foodField" style="display:${entry.type==='cash' ? 'none':'block'};">
      <label>Food / item description</label>
      <textarea id="eFood" placeholder="e.g. 2 trays boil-up, sacks of potatoes">${escapeHtml(entry.foodDesc||'')}</textarea>
    </div>
    <label>Note <span class="field-hint">(optional)</span></label>
    <input type="text" id="eNote" placeholder="optional note" value="${escapeHtml(entry.note||'')}" />

    <div class="toolbar">
      <button class="btn btn-primary btn-block" onclick="submitEntry()">${isEdit ? 'Save Changes' : 'Add'}</button>
    </div>
  `);
  const toggle = document.getElementById('typeToggle');
  toggle.querySelectorAll('button').forEach(b=>{
    b.addEventListener('click', ()=>{
      toggle.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const type = b.dataset.type;
      document.getElementById('cashField').style.display = (type==='food') ? 'none':'block';
      document.getElementById('foodField').style.display = (type==='cash') ? 'none':'block';
    });
  });
  setTimeout(()=>document.getElementById('eName').focus(), 50);
}
function submitEntry(){
  const editingId = document.getElementById('eEditingId').value;
  const name = document.getElementById('eName').value.trim();
  const date = document.getElementById('eDate').value;
  const type = document.querySelector('#typeToggle button.active').dataset.type;
  const amount = document.getElementById('eAmount') ? document.getElementById('eAmount').value : '';
  const foodDesc = document.getElementById('eFood') ? document.getElementById('eFood').value.trim() : '';
  const note = document.getElementById('eNote').value.trim();
  if(!name){ alert('Please enter who the koha is from.'); return; }
  if((type==='cash'||type==='both') && (!amount || Number(amount)<=0)){
    if(!confirm('No amount entered for cash koha — save anyway with $0.00?')) return;
  }
  if((type==='food'||type==='both') && !foodDesc){
    if(!confirm('No food/item description entered — save anyway?')) return;
  }
  closeModal();
  const fields = {name, date, type, amount: Number(amount)||0, foodDesc, note};
  if(editingId){
    updateEntry(currentHuiId, editingId, fields);
  } else {
    addEntry(currentHuiId, fields);
  }
}

function addExpenseModal(){
  const defaultDate = new Date().toISOString().slice(0,10);
  expenseModal({ date: defaultDate }, null);
}
function editExpenseModal(huiId, expenseId){
  const t = getHui(huiId);
  if(!t) return;
  const ex = t.expenses.find(x=>x.id===expenseId);
  if(!ex) return;
  expenseModal(ex, expenseId);
}
function expenseModal(expense, editingId){
  const isEdit = !!editingId;
  showModal(`
    <h3>${isEdit ? 'Edit Expense' : 'Add Expense'}</h3>
    <p class="muted">${isEdit ? 'Update this bill / expense' : 'Record a bill paid out of koha (groceries, gas bottles, etc.)'}</p>
    <input type="hidden" id="xEditingId" value="${editingId || ''}" />
    <label>What was it for</label>
    <input type="text" id="xDesc" placeholder="e.g. Groceries, gas bottles, firewood" value="${escapeHtml(expense.description||'')}" />
    <label>Amount ($NZD)</label>
    <input type="number" id="xAmount" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="${expense.amount ? expense.amount : ''}" />
    <label>Date</label>
    <input type="date" id="xDate" value="${expense.date || ''}" />
    <div class="toolbar">
      <button class="btn btn-primary btn-block" onclick="submitExpense()">${isEdit ? 'Save Changes' : 'Add Expense'}</button>
    </div>
  `);
  setTimeout(()=>document.getElementById('xDesc').focus(), 50);
}
function submitExpense(){
  const editingId = document.getElementById('xEditingId').value;
  const description = document.getElementById('xDesc').value.trim();
  const amount = document.getElementById('xAmount').value;
  const date = document.getElementById('xDate').value;
  if(!description){ alert('Please enter what the expense was for.'); return; }
  if(!amount || Number(amount)<=0){
    if(!confirm('No amount entered — save anyway with $0.00?')) return;
  }
  closeModal();
  const fields = {description, amount: Number(amount)||0, date};
  if(editingId){
    updateExpense(currentHuiId, editingId, fields);
  } else {
    addExpense(currentHuiId, fields);
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Render ---------- */
function render(){
  const app = document.getElementById('app');
  const navBtn = document.getElementById('navBtn');
  const headerTitle = document.getElementById('headerTitle');
  const headerSubtitle = document.getElementById('headerSubtitle');

  if(view==='home'){
    navBtn.style.display = 'none';
    headerTitle.textContent = 'Koha Tracker';
    headerSubtitle.textContent = 'Koha record & read-out';
    app.innerHTML = renderHome();
  } else {
    const t = getHui(currentHuiId);
    if(!t){ goHome(); return; }
    navBtn.style.display = 'inline-flex';
    headerTitle.textContent = t.name;
    headerSubtitle.textContent = `${fmtDate(t.date)}${t.location ? ' · '+escapeHtml(t.location) : ''}`;
    app.innerHTML = (view==='summary') ? renderSummary(t) : renderActive(t);
  }
}

function renderHome(){
  if(state.hui.length===0){
    return `
      <div class="card empty">
        <p style="font-size:2rem;margin:0;">🪶</p>
        <h2 style="margin:10px 0 4px;">No records yet</h2>
        <p class="muted">No koha records yet. Start your first hui record below.</p>
      </div>
      <button class="btn btn-primary btn-block" onclick="newHuiModal()">+ Start New Hui</button>
    `;
  }
  const sorted = [...state.hui].sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  const items = sorted.map(t=>{
    const tot = huiTotals(t);
    return `
      <div class="hui-item" onclick="openHui('${t.id}', '${t.status==='closed' ? 'summary':'active'}')">
        <div class="info">
          <strong>${escapeHtml(t.name)}</strong>
          <span>${fmtDate(t.date)}${t.location ? ' · '+escapeHtml(t.location):''} · ${tot.total} koha · ${money(tot.cash)}${tot.expenses>0 ? ' · net '+money(tot.net) : ''}</span>
        </div>
        <span class="badge ${t.status==='closed'?'badge-closed':'badge-open'}">${t.status==='closed'?'Closed':'Open'}</span>
      </div>`;
  }).join('');

  return `
    <button class="btn btn-primary btn-block" onclick="newHuiModal()" style="margin-bottom:16px;">+ Start New Hui</button>
    <div class="card" style="padding:6px 14px;">
      ${items}
    </div>
  `;
}

function renderActive(t){
  const tot = huiTotals(t);
  const entries = [...t.entries].sort((a,b)=>b.ts-a.ts);
  const entriesHtml = entries.length ? entries.map(e=>`
    <div class="entry">
      <div>
        <div class="who">${escapeHtml(e.name)}</div>
        <div class="meta">
          ${e.date ? fmtDate(e.date)+' · ' : ''}${e.type==='cash' ? 'Cash' : e.type==='food' ? 'Food' : 'Cash + Food'}
          ${e.foodDesc ? ' — '+escapeHtml(e.foodDesc) : ''}
          ${e.note ? ' · '+escapeHtml(e.note) : ''}
        </div>
        <div class="entry-actions no-print">
          <button onclick="editEntryModal('${t.id}','${e.id}')">Edit</button>
          <button onclick="deleteEntry('${t.id}','${e.id}')">Remove</button>
        </div>
      </div>
      <div class="amt">${(e.type==='food') ? '' : money(e.amount)}</div>
    </div>
  `).join('') : `<p class="muted" style="padding:14px 4px;">No koha entered yet. Tap "+ Add Koha" below to add the first one.</p>`;

  const expenses = [...(t.expenses||[])].sort((a,b)=>b.ts-a.ts);
  const expensesHtml = expenses.length ? expenses.map(ex=>`
    <div class="entry">
      <div>
        <div class="who">${escapeHtml(ex.description)}</div>
        <div class="meta">${ex.date ? fmtDate(ex.date) : ''}</div>
        <div class="entry-actions no-print">
          <button onclick="editExpenseModal('${t.id}','${ex.id}')">Edit</button>
          <button onclick="deleteExpense('${t.id}','${ex.id}')">Remove</button>
        </div>
      </div>
      <div class="amt">${money(ex.amount)}</div>
    </div>
  `).join('') : `<p class="muted" style="padding:14px 4px;">No expenses recorded yet.</p>`;

  return `
    <div class="card">
      <div class="totals-strip">
        <div class="total-box">
          <div class="amt">${money(tot.cash)}</div>
          <div class="lbl">Total Cash</div>
        </div>
        <div class="total-box">
          <div class="amt">${tot.total}</div>
          <div class="lbl">Koha Entries</div>
        </div>
      </div>
      <div class="totals-strip">
        <div class="total-box">
          <div class="amt">${money(tot.expenses)}</div>
          <div class="lbl">Total Expenses</div>
        </div>
        <div class="total-box">
          <div class="amt">${money(tot.net)}</div>
          <div class="lbl">Net (Cash − Expenses)</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Koha</h2>
      ${entriesHtml}
    </div>

    <div class="card">
      <h2>Expenses</h2>
      <p class="muted" style="margin-top:0;">Bills paid out of koha — groceries, gas bottles, and the like.</p>
      ${expensesHtml}
      <div class="toolbar no-print">
        <button class="btn btn-ghost btn-sm" onclick="addExpenseModal()">+ Add Expense</button>
      </div>
    </div>

    <div class="toolbar no-print">
      <button class="btn btn-ghost btn-sm" onclick="openHui('${t.id}','summary')">📋 View Summary</button>
      <button class="btn btn-ghost btn-sm" onclick="exportCSV(getHui('${t.id}'))">⬇ CSV</button>
      ${t.status==='open' ? `<button class="btn btn-danger btn-sm" onclick="closeHui('${t.id}')">Close hui</button>` : `<button class="btn btn-ghost btn-sm" onclick="reopenHui('${t.id}')">Reopen</button>`}
      <button class="btn btn-danger btn-sm" onclick="deleteHui('${t.id}')">Delete</button>
    </div>

    <div class="fab-row no-print">
      <button class="btn btn-primary btn-block" onclick="addEntryModal()">+ Add Koha</button>
    </div>
  `;
}

function renderSummary(t){
  const tot = huiTotals(t);
  const entries = [...t.entries].sort((a,b)=>a.ts-b.ts); // chronological, as received
  const listHtml = entries.length ? `<ol class="summary-list">${entries.map(e=>`
      <li>
        <span class="sname">${escapeHtml(e.name)}
          <span class="sfood">${e.date ? fmtDate(e.date) : ''}${e.foodDesc ? (e.date ? ' — ' : '')+escapeHtml(e.foodDesc) : ''}</span>
        </span>
        <span class="samt">${e.type==='food' ? 'Food' : money(e.amount)}${e.type==='both' ? ' + food' : ''}</span>
      </li>
    `).join('')}</ol>` : `<p class="muted">No koha recorded.</p>`;

  const expenses = [...(t.expenses||[])].sort((a,b)=>a.ts-b.ts);
  const expensesListHtml = expenses.length ? `<ol class="summary-list">${expenses.map(ex=>`
      <li>
        <span class="sname">${escapeHtml(ex.description)}
          <span class="sfood">${ex.date ? fmtDate(ex.date) : ''}</span>
        </span>
        <span class="samt">${money(ex.amount)}</span>
      </li>
    `).join('')}</ol>` : `<p class="muted">No expenses recorded.</p>`;

  return `
    <div class="card">
      <h2 style="text-align:center;">Koha Summary</h2>
      <p class="muted" style="text-align:center;">For reading out to whānau</p>
      <div class="totals-strip">
        <div class="total-box">
          <div class="amt">${money(tot.cash)}</div>
          <div class="lbl">Total Cash</div>
        </div>
        <div class="total-box">
          <div class="amt">${tot.total}</div>
          <div class="lbl">Total Koha</div>
        </div>
      </div>
      <div class="totals-strip">
        <div class="total-box">
          <div class="amt">${money(tot.expenses)}</div>
          <div class="lbl">Total Expenses</div>
        </div>
        <div class="total-box">
          <div class="amt">${money(tot.net)}</div>
          <div class="lbl">Net Remaining</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Koha Received</h2>
      ${listHtml}
    </div>

    <div class="card">
      <h2>Expenses</h2>
      ${expensesListHtml}
    </div>

    <div class="toolbar no-print">
      <button class="btn btn-ghost btn-sm" onclick="openHui('${t.id}','active')">← Back to entries</button>
      <button class="btn btn-primary btn-sm" onclick="window.print()">🖨 Print</button>
      <button class="btn btn-ghost btn-sm" onclick="exportCSV(getHui('${t.id}'))">⬇ CSV</button>
    </div>
  `;
}

/* ================= Install as app ================= */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'inline-flex';
});
function installApp(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(()=>{
    deferredInstallPrompt = null;
    const btn = document.getElementById('installBtn');
    if(btn) btn.style.display = 'none';
  });
}
window.addEventListener('appinstalled', ()=>{
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'none';
});

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}
if(isIOS() && !isStandalone()){
  const hint = document.getElementById('footerHint');
  if(hint) hint.textContent = 'To install: tap the Share icon in Safari, then "Add to Home Screen".';
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.warn('SW registration failed', err));
  });
}

/* ================= Boot ================= */
render();
setSyncState(navigator.onLine ? 'online' : 'offline');
if(sb){ initialSync(); }
</script>
